[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "combinatorics-corpus"
version = "0.1.0"
description = "Reproducible pipeline harvesting math.CO arXiv papers into a deduplicated, provenance-tracked corpus of formal mathematical statements."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "pylatexenc>=2.10",
  "datasketch>=1.6",
  "pyarrow>=15.0",
  "boto3>=1.34",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
